name: Go Module Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: macos-13
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build Go module
        run: |
          cd go
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o ../bin/poml-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/pomlcli

      - name: Test Go module
        run: |
          cd go
          go test ./...

      - name: Upload Go binary for ${{ matrix.goos }}-${{ matrix.goarch }}
        uses: actions/upload-artifact@v4
        with:
          name: poml-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/poml-${{ matrix.goos }}-${{ matrix.goarch }}
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
